apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - auth/auth.yaml
  - auth/ingress.yaml
  - auth/service.yaml
  - postgres.yaml
  - redis.yaml
  - hpa.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
- name: platform-backend
  newName: ghcr.io/vitevue/platform-backend # {"$imagepolicy": "flux-system:flux-system:platform-backend-production:name"}
  newTag: production                        # {"$imagepolicy": "flux-system:flux-system:platform-backend-production:tag"}