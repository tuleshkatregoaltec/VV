apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitevue-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      com.vitevue.k8s.service: vitevue-platform
  template:
    metadata:
      labels:
        com.vitevue.k8s.service: vitevue-platform
    spec:
      containers:
      - name: backend
        image: ghcr.io/vitevue/platform-backend:production
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ALLOWED_ORIGINS
          value: '["https://vitevue.com"]'
        - name: REDIS_URL
          value: "redis://vitevue-platform-backend-redis-headless"
        - name: WORKOS_REDIRECT_URI
          value: "https://api.vitevue.com/auth/callback"
        - name: FRONTEND_URL
          value: "https://vitevue.com"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: database_url
        - name: WORKOS_API_KEY
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: workos_api_key
        - name: WORKOS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: workos_client_id
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: session_secret
        - name: HONEYBADGER_API_KEY
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: honeybadger_key
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: openrouter_key
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: service_api_key
         - name: R2_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: r2_endpoint_url

         - name: R2_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: r2_access_key_id
         - name: R2_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: r2_secret_access_key
         - name: R2_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: r2_bucket_name
         - name: R2_REGION
          valueFrom:
            secretKeyRef:
              name: vitevue-backend-creds
              key: r2_region
        # below needs modifying
        livenessProbe:
          exec:
            command:
            - curl 
            - --silent 
            - --fail
            - http://localhost:8000/api/v1/health
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
          - name: logs
            mountPath: /app/logs
      imagePullSecrets:
      - name: ghcr-credentials
      volumes:
        - name: logs
          emptyDir: {}
