apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitevue-platform-backend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
spec:
  tls:
  - hosts:
    - api.vitevue.com
    secretName: vitevue-api-tls-secret
  rules:
  - host: api.vitevue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vitevue-platform
            port:
              number: 80