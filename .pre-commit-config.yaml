repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --project backend ruff format
        language: system
        files: ^backend/.*\.py$
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --project backend ruff check --fix --exit-non-zero-on-fix
        language: system
        files: ^backend/.*\.py$
      - id: frontend-biome
        name: frontend biome
        entry: bash -lc 'cd frontend && set -- "${@/#frontend\//}"; ./node_modules/.bin/biome check --diagnostic-level=error "$@"' --
        language: system
        files: ^frontend/
