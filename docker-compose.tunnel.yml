services:
  auth:
    environment:
      API_EXTERNAL_URL: https://demo-auth.vitevue.com
      GOTRUE_SITE_URL: https://demo.vitevue.com
      GOTRUE_URI_ALLOW_LIST: https://demo.vitevue.com,http://localhost:5173

  backend:
