[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holocron"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.7",
    "boto3>=1.34",
    "clickhouse-connect>=0.7",
    "pydantic-settings>=2.2",
    "playwright>=1.52",
    "2captcha-python>=2.0.5",
    "psycopg[binary]>=3.2",
    "dagster-postgres>=0.29.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["holocron*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.6",
]
