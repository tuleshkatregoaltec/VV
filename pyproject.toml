[project]
name = "analytics-backend"
version = "0.1.0"
description = "Backend for analytics platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.120.1",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2>=2.9.11",
    "pydantic>=2.12.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "ruff>=0.14.2",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.38.0",
    "requests>=2.32.5",
    "tqdm>=4.66.0",
]

[project.scripts]
dbcli = "backend.scripts.db_utils.dbcli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["data*", "scripts*"]
