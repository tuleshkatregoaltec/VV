[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holocron"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-postgres>=0.23",
    "boto3>=1.34",
    "clickhouse-connect>=0.7",
    "httpx>=0.27",
    "playwright>=1.52",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "dagster-webserver>=1.7",
    "moto[s3]>=5",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["holocron*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "dagster-webserver>=1.7",
    "moto[s3]>=5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.6",
]
