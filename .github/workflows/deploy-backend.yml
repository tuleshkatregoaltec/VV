name: Deploy backend

# Manual only: Actions -> "Deploy backend" -> Run workflow, pick the branch (normally VV).
# Each run backs up Postgres, then runs database migrations on the live pilot server.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Server SSH is reached through the Cloudflare tunnel on the server, guarded by
      # a Cloudflare Access service token. Setup: deploy/hetzner/README.md.
      DEPLOY_HOST: deploy-ssh.vitevue.com
      DEPLOY_USER: maan
      CLOUDFLARED_VERSION: '2026.10.7'
    steps:
      - name: Check deploy secrets
        env:
          SSH_KEY: ${{ secrets.VV_DEPLOY_SSH_KEY }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          missing=()
          [ -n "$SSH_KEY" ] || missing+=(VV_DEPLOY_SSH_KEY)
          [ -n "$CF_ID" ] || missing+=(CF_ACCESS_CLIENT_ID)
          [ -n "$CF_SECRET" ] || missing+=(CF_ACCESS_CLIENT_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see deploy/hetzner/README.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VV_DEPLOY_SSH_KEY }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vv_deploy
          chmod 600 ~/.ssh/vv_deploy
          echo "${DEPLOY_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBaraMT0qrh8X6DrOut8mUK6aeu9sqX89V1sdrdb0t4V" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vv-deploy
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/vv_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            HostKeyAlias ${DEPLOY_HOST}
            ProxyCommand ${RUNNER_TEMP}/cloudflared access ssh --hostname %h --service-token-id ${CF_ID} --service-token-secret ${CF_SECRET}
          EOF
          chmod 600 ~/.ssh/config

      - name: Push commit to the server
        run: git push vv-deploy:vv.git "${GITHUB_SHA}:refs/heads/deploy"

      - name: Deploy
        run: ssh vv-deploy "deploy ${GITHUB_SHA}"

      - name: Summary
        if: always()
        run: |
          echo "### Backend deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- server log and backup path: see the Deploy step" >> "$GITHUB_STEP_SUMMARY"
