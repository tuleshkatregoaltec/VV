name: Frontend

on:
  pull_request:
  push:
    branches: [VV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Use dummy configuration without credentials or telemetry
        run: cp backend/tests/evaluation/offline.env .env.dev
      - name: Lint
        run: just lint-frontend
      - name: Svelte and TypeScript check
        run: just check-frontend
      - name: Unit tests
        run: just test-frontend
      - name: Production build
        run: just build-frontend
      - name: Fail if checks modified tracked files
        run: git diff --exit-code

  deploy:
    # Push to VV -> production deploy of Cloudflare Pages project vv-pilot.
    # Pull request from this repo -> preview deploy (URL in the job summary).
    # Needs repository secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit).
    name: deploy-website
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/VV') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-website-${{ github.event_name == 'push' && 'production' || github.head_ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      DO_NOT_TRACK: '1'
      CLOUDFLARE_ACCOUNT_ID: 083b3f7d7b4ec9b9fa911ebed2fbf024
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: vv-pilot
    steps:
      - name: Check deploy secret
        id: secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the website was not deployed (see deploy/hetzner/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secret.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.secret.outputs.ready == 'true'
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        if: steps.secret.outputs.ready == 'true'
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Build
        # Public settings come from frontend/wrangler.jsonc `vars` at runtime; no .env is read.
        if: steps.secret.outputs.ready == 'true'
        run: bun run build
        working-directory: frontend
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.secret.outputs.ready == 'true'
        working-directory: frontend
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          # vv-pilot's production branch is "main"; everything else is a preview.
          if [ "$EVENT_NAME" = push ]; then branch=main; else branch="pr-${PR_NUMBER}"; fi
          bunx wrangler pages deploy --project-name "$PAGES_PROJECT" --branch "$branch" \
            --commit-hash "$COMMIT_SHA" --commit-dirty=false 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)"
          {
            echo "### Website deploy ($branch)"
            echo "- Pages project: \`$PAGES_PROJECT\`"
            echo "- commit: \`$COMMIT_SHA\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
