name: Frontend

on:
  pull_request:
  push:
    branches: [VV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Use dummy configuration without credentials or telemetry
        run: cp backend/tests/evaluation/offline.env .env.dev
      - name: Lint
        run: just lint-frontend
      - name: Svelte and TypeScript check
        run: just check-frontend
      - name: Unit tests
        run: just test-frontend
      - name: Production build
        run: just build-frontend
      - name: Fail if checks modified tracked files
        run: git diff --exit-code
