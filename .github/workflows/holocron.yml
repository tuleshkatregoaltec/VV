name: Holocron

on:
  pull_request:
  push:
    branches: [VV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: holocron-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every uv run inside the recipe must use holocron/uv.lock unchanged.
      UV_LOCKED: '1'
      DAGSTER_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.11'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install locked dependencies with the admin extra
        run: uv sync --project holocron --extra admin
      # No .env is present: the suite needs no credentials or live services.
      - name: Check formatting, lint, types and tests
        run: just holocron check
      - name: Fail if checks modified tracked files
        run: git diff --exit-code
