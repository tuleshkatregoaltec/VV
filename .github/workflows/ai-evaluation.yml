name: AI evaluation infrastructure

# No path filters: these checks are meant to become required, and the engine
# parity tests also depend on frontend code.
on:
  pull_request:
  push:
    branches: [VV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: backend-offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Bun runs the frontend feasibility engine for the parity tests; its
      # install runs svelte-kit sync, which needs Node 20.19+, to resolve $lib.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: |
          uv sync --project backend --locked
          cd frontend && bun install --frozen-lockfile
      - name: Use dummy configuration without model or telemetry credentials
        run: cp backend/tests/evaluation/offline.env .env.dev
      - name: Run fast backend suite, including evaluation, architecture and engine parity
        run: just test-backend
      - name: Lint backend
        run: just lint-backend
      - name: Fail if checks modified tracked files
        run: git diff --exit-code
