services:
  postgres:
    image: postgres:16-alpine
    container_name: vitevue-postgres
    environment:
      POSTGRES_USER: vitevue
      POSTGRES_PASSWORD: vitevue_dev
      POSTGRES_DB: vitevue
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitevue"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db-init:
    image: postgres:18-alpine
    container_name: vitevue-auth-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: vitevue
      PGUSER: vitevue
      PGPASSWORD: vitevue_dev
      AUTH_USER: supabase_auth_admin
      AUTH_PASSWORD: supabase_auth_admin
    command:
      - sh
      - -lc
      - |
        set -euo pipefail
        psql -v ON_ERROR_STOP=1 \
          -v auth_user="$$AUTH_USER" \
          -v auth_pass="$$AUTH_PASSWORD" \
          <<'SQL'
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN
            CREATE ROLE postgres WITH LOGIN SUPERUSER;
          END IF;
        END $$$$;

        SELECT format(
          'create role %I login noinherit createrole noreplication password %L',
          :'auth_user',
          :'auth_pass'
        )
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_roles WHERE rolname = :'auth_user'
        )\gexec

        create schema if not exists auth authorization :"auth_user";
        alter role :"auth_user" set search_path = 'auth';
        SQL

  auth:
    image: ghcr.io/supabase/auth:v2.185.0
    container_name: vitevue-auth
    restart: on-failure
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:supabase_auth_admin@postgres:5432/vitevue
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173,http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_GROUP_NAME: admin
      GOTRUE_JWT_DEFAULT_GROUP_NAME: user
      GOTRUE_JWT_ADMIN_ROLES: service_role,supabase_admin,admin
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_SENDER_NAME: ViteVue
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
    ports:
      - "9999:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  inbucket:
    image: inbucket/inbucket:stable
    container_name: vitevue-inbucket
    ports:
      - "2500:2500"
      - "9000:9000"
      - "1100:1100"
    environment:
      INBUCKET_SMTP_ADDR: 0.0.0.0:2500
      INBUCKET_WEB_ADDR: 0.0.0.0:9000
      INBUCKET_POP3_ADDR: 0.0.0.0:1100

  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: vitevue-clickhouse
    environment:
      CLICKHOUSE_DB: vitevue
      CLICKHOUSE_USER: vitevue
      CLICKHOUSE_PASSWORD: vitevue_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9001:9000"
    volumes:
      - ./.docker-volumes/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vitevue-redis
    command: redis-server --requirepass vitevue_dev
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vitevue_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vitevue-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./.docker-volumes/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: vitevue-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/vitevue-dev --ignore-existing;
      mc anonymous set public local/vitevue-dev;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: vitevue-backend
    working_dir: /app/backend
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://vitevue:vitevue_dev@postgres:5432/vitevue
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: vitevue
      CLICKHOUSE_PASSWORD: vitevue_dev
      CLICKHOUSE_DB: vitevue
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: vitevue_dev
      AUTH_URL: http://auth:8081
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: vitevue-dev
      S3_REGION: us-east-1
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - backend_venv:/app/backend/.venv
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: sh -lc "scripts/lifecycle/prestart.sh && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: vitevue-frontend
    working_dir: /app/frontend
    env_file:
      - .env.dev
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8000
      PUBLIC_AUTH_BASE_URL: http://localhost:9999
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - frontend_svelte_kit:/app/frontend/.svelte-kit
    depends_on:
      backend:
        condition: service_healthy
    command: sh -lc "bun install && bun run dev --host 0.0.0.0 --port 5173"

  playwright:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    container_name: vitevue-playwright
    working_dir: /work/e2e
    init: true
    network_mode: host
    shm_size: 1gb
    environment:
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    volumes:
      - .:/work
      - playwright_node_modules:/work/e2e/node_modules
      - ./.docker-volumes/playwright/auth:/work/e2e/.auth
      - ./.docker-volumes/playwright/report:/work/playwright-report
      - ./.docker-volumes/playwright/results:/work/test-results
    command: bash -lc "tail -f /dev/null"

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"

volumes:
  backend_venv:
  frontend_svelte_kit:
  playwright_node_modules:
