services:
  postgres:
    image: postgres:16-alpine
    container_name: vitevue-postgres
    environment:
      POSTGRES_USER: vitevue
      POSTGRES_PASSWORD: vitevue_dev
      POSTGRES_DB: vitevue
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitevue"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auth database initialization
  auth-db-init:
    image: postgres:18-alpine
    container_name: vitevue-auth-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: vitevue
      PGUSER: vitevue
      PGPASSWORD: vitevue_dev
      AUTH_USER: supabase_auth_admin
      AUTH_PASSWORD: supabase_auth_admin
    command:
      - sh
      - -lc
      - |
        set -euo pipefail
        psql -v ON_ERROR_STOP=1 \
          -v auth_user="$$AUTH_USER" \
          -v auth_pass="$$AUTH_PASSWORD" \
          <<'SQL'
        -- Create postgres role if missing (needed by GoTrue migrations)
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN
            CREATE ROLE postgres WITH LOGIN SUPERUSER;
          END IF;
        END $$$$;

        -- Create auth role only if missing
        SELECT format(
          'create role %I login noinherit createrole noreplication password %L',
          :'auth_user',
          :'auth_pass'
        )
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_roles WHERE rolname = :'auth_user'
        )\gexec

        -- Ensure schema + search_path
        create schema if not exists auth authorization :"auth_user";
        alter role :"auth_user" set search_path = 'auth';
        SQL

  # Supabase Auth Service (GoTrue)
  auth:
    image: ghcr.io/supabase/auth:v2.185.0
    container_name: vitevue-auth
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:supabase_auth_admin@postgres:5432/vitevue
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173,http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_GROUP_NAME: admin
      GOTRUE_JWT_DEFAULT_GROUP_NAME: user
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_SENDER_NAME: ViteVue
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/confirm
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/confirm
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/reset-password
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/confirm
    ports:
      - "9999:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Inbucket - Local email testing (for auth emails)
  inbucket:
    image: inbucket/inbucket:stable
    container_name: vitevue-inbucket
    ports:
      - "2500:2500"  # SMTP
      - "9000:9000"  # Web UI
      - "1100:1100"  # POP3
    environment:
      INBUCKET_SMTP_ADDR: 0.0.0.0:2500
      INBUCKET_WEB_ADDR: 0.0.0.0:9000
      INBUCKET_POP3_ADDR: 0.0.0.0:1100

  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: vitevue-clickhouse
    environment:
      CLICKHOUSE_DB: vitevue
      CLICKHOUSE_USER: vitevue
      CLICKHOUSE_PASSWORD: vitevue_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9001:9000"  # Native client (changed from 9000 to avoid conflict with inbucket)
    volumes:
      - ./.docker-volumes/clickhouse:/var/lib/clickhouse
      - ./init-clickhouse.sh:/docker-entrypoint-initdb.d/init-clickhouse.sh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vitevue-redis
    command: redis-server --requirepass vitevue_dev
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vitevue_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO - Local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: vitevue-minio
    ports:
      - "9002:9000"  # API
      - "9003:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./.docker-volumes/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create MinIO bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: vitevue-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/vitevue-dev --ignore-existing;
      mc anonymous set public local/vitevue-dev;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: backend.dev.Dockerfile
    container_name: vitevue-backend
    env_file:
      - .env.dev
    environment:
      # Override/set local service URLs
      DATABASE_URL: postgresql+asyncpg://vitevue:vitevue_dev@postgres:5432/vitevue
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: vitevue
      CLICKHOUSE_PASSWORD: vitevue_dev
      CLICKHOUSE_DB: vitevue
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: vitevue_dev
      AUTH_URL: http://auth:8081
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'

      # Local S3 (MinIO)
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: vitevue-dev
      S3_REGION: us-east-1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      minio:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend.dev.Dockerfile
    container_name: vitevue-frontend
    env_file:
      - .env.dev
    environment:
      # Override with local URLs
      PUBLIC_API_BASE_URL: http://localhost:8000
      PUBLIC_AUTH_BASE_URL: http://localhost:9999
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    command: bun run dev --host 0.0.0.0

# All data is now stored in .docker-volumes/ directory
