services:
  dagster-webserver:
    image: holocron:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /app/workspace.yaml
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    environment:
      DAGSTER_HOME: /app
      PYTHONUNBUFFERED: "1"
    env_file:
      - ${ENV_FILE:-.env}
    restart: unless-stopped
    depends_on:
      dagster-daemon:
        condition: service_started

  dagster-daemon:
    image: holocron:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: dagster-daemon run -w /app/workspace.yaml
    environment:
      DAGSTER_HOME: /app
      PYTHONUNBUFFERED: "1"
    env_file:
      - ${ENV_FILE:-.env}
    restart: unless-stopped
